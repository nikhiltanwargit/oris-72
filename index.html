<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIBRARY OF BABEL // AETHER</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403}
canvas{display:block}

#hud{
position:fixed;
top:18px;
left:20px;
z-index:10;
color:#eee4d2;
font-family:Arial,sans-serif;
text-shadow:0 0 14px #000;
pointer-events:none;
}

#title{
font-size:18px;
font-weight:bold;
letter-spacing:3px;
}

#status{
margin-top:7px;
font-size:11px;
letter-spacing:2px;
opacity:.65;
}

#start{
position:fixed;
inset:0;
z-index:20;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle,#241b1255,#000 80%);
cursor:pointer;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

.box{
padding:35px 55px;
background:#090705dd;
border:1px solid #c7a86a55;
box-shadow:0 0 80px #000;
}

.box h1{
margin:0 0 15px;
font-size:28px;
letter-spacing:8px;
}

.box p{
font-size:11px;
letter-spacing:3px;
opacity:.6;
}

#cross{
position:fixed;
left:50%;
top:50%;
width:9px;
height:9px;
transform:translate(-50%,-50%);
z-index:9;
pointer-events:none;
}

#cross:before,#cross:after{
content:"";
position:absolute;
background:#e8d9b988;
}

#cross:before{width:9px;height:1px;top:4px}
#cross:after{height:9px;width:1px;left:4px}
</style>
</head>

<body>

<div id="hud">
<div id="title">LIBRARY OF BABEL // AETHER</div>
<div id="status">LOADING ARCHIVE...</div>
</div>

<div id="cross"></div>

<div id="start">
<div class="box">
<h1>LIBRARY OF BABEL</h1>
<p>CLICK TO ENTER</p>
<p>WASD · MOUSE · SHIFT TO SPRINT · ESC TO RELEASE</p>
</div>
</div>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {PointerLockControls} from "three/addons/controls/PointerLockControls.js";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";


/* =========================
   SCENE
========================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x050403);

scene.fog=new THREE.FogExp2(
0x17130f,
0.008
);


/* =========================
   CAMERA
========================= */

const camera=new THREE.PerspectiveCamera(
72,
innerWidth/innerHeight,
0.05,
300
);

camera.position.set(
0,
3,
-30
);


/* =========================
   RENDERER
========================= */

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(
Math.min(devicePixelRatio,1.5)
);

renderer.outputColorSpace=THREE.SRGBColorSpace;

renderer.toneMapping=THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.25;

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


/* =========================
   CINEMATIC POST
========================= */

const composer=new EffectComposer(renderer);

composer.addPass(
new RenderPass(scene,camera)
);

const bloom=new UnrealBloomPass(
new THREE.Vector2(innerWidth,innerHeight),
0.16,
0.55,
0.88
);

composer.addPass(bloom);

composer.addPass(
new OutputPass()
);


/* =========================
   LIGHTING
========================= */

const hemi=new THREE.HemisphereLight(
0xffe8c4,
0x090604,
1.8
);

scene.add(hemi);


const sun=new THREE.DirectionalLight(
0xffd29a,
2.2
);

sun.position.set(
-25,
45,
-30
);

sun.castShadow=true;

sun.shadow.mapSize.set(
1024,
1024
);

sun.shadow.camera.near=1;
sun.shadow.camera.far=180;

sun.shadow.camera.left=-80;
sun.shadow.camera.right=80;
sun.shadow.camera.top=80;
sun.shadow.camera.bottom=-80;

scene.add(sun);


/* warm architectural lights */

function addLight(x,y,z,color,intensity,distance){

const l=new THREE.PointLight(
color,
intensity,
distance,
2
);

l.position.set(x,y,z);

scene.add(l);

}


/* warm pools */

addLight(0,10,-20,0xffa34d,180,55);
addLight(-20,15,0,0xffb45c,150,50);
addLight(20,18,5,0xffc477,170,55);
addLight(0,25,20,0xffc985,200,65);

addLight(-25,8,-25,0x7d96c4,70,45);
addLight(25,12,-15,0x7d96c4,60,45);


/* =========================
   MATERIAL ENHANCEMENT
========================= */

function tuneMaterial(m){

if(!m || !m.name) return;

const n=m.name.toLowerCase();

if(!m.color)
return;


/* stone */

if(
n.includes("stone") ||
n.includes("carved")
){
m.color.set("#776a5a");
m.roughness=.78;
m.metalness=0;
}


/* marble */

else if(n.includes("marble")){

m.color.set("#aaa08e");
m.roughness=.55;
m.metalness=0;
}


/* gold */

else if(
n.includes("gold") ||
n.includes("aged gold")
){

m.color.set("#b8893e");
m.roughness=.35;
m.metalness=.72;

}


/* normal wood */

else if(
n.includes("wood")
){

m.color.set("#3b2115");
m.roughness=.82;
m.metalness=0;

}


/* books */

else if(
n.includes("red books")
){

m.color.set("#72251e");
m.roughness=.9;
m.metalness=0;

}

else if(
n.includes("blue books")
){

m.color.set("#263e63");
m.roughness=.9;
m.metalness=0;

}

else if(
n.includes("old books")
){

m.color.set("#55402b");
m.roughness=.88;
m.metalness=0;

}

else if(
n.includes("book")
){

m.color.set("#4b3525");
m.roughness=.88;
m.metalness=0;

}


/* leather */

else if(n.includes("leather")){

m.color.set("#351c13");
m.roughness=.82;
m.metalness=0;

}


/* iron */

else if(n.includes("iron")){

m.color.set("#242528");
m.roughness=.55;
m.metalness=.65;

}

}


/* =========================
   LOAD LIBRARY
========================= */

const loader=new GLTFLoader();

loader.load(

"babel_library_v10.glb",

(gltf)=>{

const root=gltf.scene;

scene.add(root);


/* DO NOT CENTER OR RESCALE THE BLENDER WORLD */

root.traverse(obj=>{

if(!obj.isMesh)
return;

obj.castShadow=false;
obj.receiveShadow=true;

if(obj.material){

const mats=Array.isArray(obj.material)
?obj.material
:[obj.material];

mats.forEach(m=>{

tuneMaterial(m);

m.needsUpdate=true;

});

}

});


/* =========================
   FIND WORLD SIZE
========================= */

const box=new THREE.Box3()
.setFromObject(root);

const center=box.getCenter(
new THREE.Vector3()
);

const size=box.getSize(
new THREE.Vector3()
);


/* =========================
   PLAYER START
========================= */

camera.position.set(
center.x,
box.min.y+2.2,
center.z-30
);


/* look into library */

const target=new THREE.Vector3(
center.x,
box.min.y+9,
center.z
);

camera.lookAt(target);


/* =========================
   MORE LIGHTS AROUND WORLD
========================= */

for(let i=0;i<7;i++){

const a=(i/7)*Math.PI*2;

const x=center.x+
Math.cos(a)*22;

const z=center.z+
Math.sin(a)*22;

addLight(
x,
box.min.y+10+(i%3)*7,
z,
i%2
?0xffa95c
:0xffd08a,
85,
38
);

}


document.getElementById("status").textContent=
"ARCHIVE ONLINE // V10 // AETHER";


},

undefined,

(error)=>{

console.error(error);

document.getElementById("status").textContent=
"ARCHIVE LOAD ERROR";

}

);


/* =========================
   CONTROLS
========================= */

const controls=
new PointerLockControls(
camera,
document.body
);

document
.getElementById("start")
.addEventListener(
"click",
()=>{
controls.lock();
}
);

controls.addEventListener(
"lock",
()=>{
document.getElementById("start")
.style.display="none";
}
);

controls.addEventListener(
"unlock",
()=>{
document.getElementById("start")
.style.display="flex";
}
);


/* =========================
   MOVEMENT
========================= */

const keys={};

addEventListener(
"keydown",
e=>{
keys[e.code]=true;
}
);

addEventListener(
"keyup",
e=>{
keys[e.code]=false;
}
);

const clock=new THREE.Clock();

function movement(dt){

if(!controls.isLocked)
return;

const speed=
(keys.ShiftLeft||keys.ShiftRight)
?14
:6;

if(keys.KeyW)
controls.moveForward(speed*dt);

if(keys.KeyS)
controls.moveForward(-speed*dt);

if(keys.KeyA)
controls.moveRight(-speed*dt);

if(keys.KeyD)
controls.moveRight(speed*dt);


/* player height */

if(camera.position.y<1.8)
camera.position.y=1.8;

}


/* =========================
   DUST
========================= */

const dustGeometry=
new THREE.BufferGeometry();

const count=900;

const positions=
new Float32Array(count*3);

for(let i=0;i<count;i++){

positions[i*3]=
(Math.random()-.5)*100;

positions[i*3+1]=
Math.random()*45;

positions[i*3+2]=
(Math.random()-.5)*100;

}

dustGeometry.setAttribute(
"position",
new THREE.BufferAttribute(
positions,
3
)
);

const dustMaterial=
new THREE.PointsMaterial({

color:0xd8c6a8,

size:.025,

transparent:true,

opacity:.16,

depthWrite:false

});

scene.add(
new THREE.Points(
dustGeometry,
dustMaterial
)
);


/* =========================
   RESIZE
========================= */

addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

composer.setSize(
innerWidth,
innerHeight
);

}
);


/* =========================
   LOOP
========================= */

function animate(){

requestAnimationFrame(
animate
);

const dt=
Math.min(
clock.getDelta(),
.05
);

movement(dt);

composer.render();

}

animate();

</script>

</body>
</html>
