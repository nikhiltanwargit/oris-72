<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIBRARY OF BABEL // AETHER</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050403;
}

canvas{display:block}

#hud{
    position:fixed;
    top:18px;
    left:20px;
    z-index:10;
    color:#eee4d2;
    font-family:Arial,sans-serif;
    text-shadow:0 0 14px #000;
    pointer-events:none;
}

#title{
    font-size:18px;
    font-weight:bold;
    letter-spacing:3px;
}

#status{
    margin-top:7px;
    font-size:11px;
    letter-spacing:2px;
    opacity:.65;
}

#start{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle,#241b1255,#000 80%);
    cursor:pointer;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.box{
    padding:35px 55px;
    background:#090705dd;
    border:1px solid #c7a86a55;
    box-shadow:0 0 80px #000;
}

.box h1{
    margin:0 0 15px;
    font-size:28px;
    letter-spacing:8px;
}

.box p{
    font-size:11px;
    letter-spacing:3px;
    opacity:.6;
}

#cross{
    position:fixed;
    left:50%;
    top:50%;
    width:9px;
    height:9px;
    transform:translate(-50%,-50%);
    z-index:9;
    pointer-events:none;
}

#cross:before,#cross:after{
    content:"";
    position:absolute;
    background:#e8d9b988;
}

#cross:before{
    width:9px;
    height:1px;
    top:4px;
}

#cross:after{
    height:9px;
    width:1px;
    left:4px;
}
</style>
</head>

<body>

<div id="hud">
    <div id="title">LIBRARY OF BABEL // AETHER</div>
    <div id="status">LOADING ARCHIVE...</div>
</div>

<div id="cross"></div>

<div id="start">
    <div class="box">
        <h1>LIBRARY OF BABEL</h1>
        <p>CLICK TO ENTER</p>
        <p>WASD · MOUSE · SPACE · SHIFT TO SPRINT · ESC</p>
    </div>
</div>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {PointerLockControls} from "three/addons/controls/PointerLockControls.js";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050403);

scene.fog = new THREE.FogExp2(
    0x17130f,
    0.008
);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    72,
    innerWidth / innerHeight,
    0.05,
    300
);

camera.position.set(
    0,
    3,
    -30
);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.25;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   POST PROCESSING
========================================================= */

const composer =
    new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene,camera)
);

const bloom =
    new UnrealBloomPass(
        new THREE.Vector2(
            innerWidth,
            innerHeight
        ),
        0.16,
        0.55,
        0.88
    );

composer.addPass(bloom);

composer.addPass(
    new OutputPass()
);


/* =========================================================
   LIGHTING
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xffe8c4,
        0x090604,
        1.8
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffd29a,
        2.2
    );

sun.position.set(
    -25,
    45,
    -30
);

sun.castShadow = true;

sun.shadow.mapSize.set(
    1024,
    1024
);

sun.shadow.camera.near = 1;
sun.shadow.camera.far = 180;

sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;

scene.add(sun);


/* =========================================================
   LIGHT HELPER
========================================================= */

function addLight(
    x,
    y,
    z,
    color,
    intensity,
    distance
){

    const light =
        new THREE.PointLight(
            color,
            intensity,
            distance,
            2
        );

    light.position.set(
        x,y,z
    );

    scene.add(light);
}


addLight(
    0,10,-20,
    0xffa34d,
    180,
    55
);

addLight(
    -20,15,0,
    0xffb45c,
    150,
    50
);

addLight(
    20,18,5,
    0xffc477,
    170,
    55
);

addLight(
    0,25,20,
    0xffc985,
    200,
    65
);

addLight(
    -25,8,-25,
    0x7d96c4,
    70,
    45
);

addLight(
    25,12,-15,
    0x7d96c4,
    60,
    45
);


/* =========================================================
   MATERIALS
========================================================= */

function tuneMaterial(m){

    if(!m || !m.name)
        return;

    const n =
        m.name.toLowerCase();

    if(!m.color)
        return;


    if(
        n.includes("stone") ||
        n.includes("carved")
    ){

        m.color.set("#776a5a");
        m.roughness = .78;
        m.metalness = 0;
    }

    else if(
        n.includes("marble")
    ){

        m.color.set("#aaa08e");
        m.roughness = .55;
        m.metalness = 0;
    }

    else if(
        n.includes("gold")
    ){

        m.color.set("#b8893e");
        m.roughness = .35;
        m.metalness = .72;
    }

    else if(
        n.includes("wood")
    ){

        m.color.set("#3b2115");
        m.roughness = .82;
        m.metalness = 0;
    }

    else if(
        n.includes("red books")
    ){

        m.color.set("#72251e");
        m.roughness = .9;
        m.metalness = 0;
    }

    else if(
        n.includes("blue books")
    ){

        m.color.set("#263e63");
        m.roughness = .9;
        m.metalness = 0;
    }

    else if(
        n.includes("old books")
    ){

        m.color.set("#55402b");
        m.roughness = .88;
        m.metalness = 0;
    }

    else if(
        n.includes("book")
    ){

        m.color.set("#4b3525");
        m.roughness = .88;
        m.metalness = 0;
    }

    else if(
        n.includes("iron")
    ){

        m.color.set("#242528");
        m.roughness = .55;
        m.metalness = .65;
    }

}


/* =========================================================
   LOAD V10 LIBRARY
========================================================= */

const loader =
    new GLTFLoader();

let library = null;

loader.load(

    "babel_library_v10.glb",

    (gltf)=>{

        const root = gltf.scene;

        library = root;

        scene.add(root);


        root.traverse(
            obj=>{

                if(!obj.isMesh)
                    return;

                obj.castShadow = false;

                obj.receiveShadow = true;


                if(obj.material){

                    const materials =
                        Array.isArray(obj.material)
                        ? obj.material
                        : [obj.material];


                    materials.forEach(
                        m=>{

                            tuneMaterial(m);

                            m.needsUpdate = true;

                        }
                    );

                }

            }
        );


        /*
           IMPORTANT:
           Keep the Blender world exactly
           where it was exported.
        */

        const box =
            new THREE.Box3()
            .setFromObject(root);

        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        /*
           Same basic camera idea as
           the version that looked good.
        */

        camera.position.set(
            center.x,
            box.min.y + 3,
            center.z - 30
        );


        camera.lookAt(
            center.x,
            box.min.y + 9,
            center.z
        );


        /*
           Additional lights around
           the actual library.
        */

        for(
            let i=0;
            i<8;
            i++
        ){

            const angle =
                (i/8) *
                Math.PI * 2;

            const radius = 22;

            const x =
                center.x +
                Math.cos(angle)*radius;

            const z =
                center.z +
                Math.sin(angle)*radius;

            addLight(
                x,
                box.min.y + 10 +
                (i%3)*6,
                z,
                i%2
                    ? 0xffa95c
                    : 0xffd08a,
                65,
                38
            );

        }


        document
        .getElementById("status")
        .textContent =
        "ARCHIVE ONLINE // V10 // WASD + SPACE";

    },

    undefined,

    error=>{

        console.error(error);

        document
        .getElementById("status")
        .textContent =
        "ARCHIVE LOAD ERROR";

    }

);


/* =========================================================
   POINTER LOCK
========================================================= */

const controls =
    new PointerLockControls(
        camera,
        document.body
    );


document
.getElementById("start")
.addEventListener(
    "click",
    ()=>{
        controls.lock();
    }
);


controls.addEventListener(
    "lock",
    ()=>{

        document
        .getElementById("start")
        .style.display =
        "none";

    }
);


controls.addEventListener(
    "unlock",
    ()=>{

        document
        .getElementById("start")
        .style.display =
        "flex";

    }
);


/* =========================================================
   PLAYER PHYSICS
========================================================= */

const keys = {};

let velocityY = 0;

let grounded = false;

const GRAVITY = 28;

const JUMP_POWER = 10;

const PLAYER_HEIGHT = 1.8;


/* =========================================================
   INPUT
========================================================= */

addEventListener(
    "keydown",
    e=>{

        keys[e.code] = true;


        /* SPACE = JUMP */

        if(
            e.code === "Space" &&
            grounded
        ){

            velocityY =
                JUMP_POWER;

            grounded = false;

        }

    }
);


addEventListener(
    "keyup",
    e=>{

        keys[e.code] = false;

    }
);


/* =========================================================
   FLOOR RAYCAST
========================================================= */

const floorRay =
    new THREE.Raycaster();

const down =
    new THREE.Vector3(
        0,
        -1,
        0
    );


function getFloor(){

    if(!library)
        return null;


    /*
       Start above the player's head
       and shoot straight down.
    */

    floorRay.set(
        new THREE.Vector3(
            camera.position.x,
            camera.position.y + 1.0,
            camera.position.z
        ),
        down
    );


    const hits =
        floorRay.intersectObject(
            library,
            true
        );


    if(!hits.length)
        return null;


    /*
       First surface underneath us.
    */

    return hits[0].point.y;
}


/* =========================================================
   MOVEMENT
========================================================= */

function movement(dt){

    if(!controls.isLocked)
        return;


    const speed =
        (
            keys.ShiftLeft ||
            keys.ShiftRight
        )
        ? 14
        : 6;


    /*
       NORMAL WASD
    */

    if(keys.KeyW)
        controls.moveForward(
            speed * dt
        );

    if(keys.KeyS)
        controls.moveForward(
            -speed * dt
        );

    if(keys.KeyA)
        controls.moveRight(
            -speed * dt
        );

    if(keys.KeyD)
        controls.moveRight(
            speed * dt
        );


    /*
       GRAVITY
    */

    velocityY -=
        GRAVITY * dt;

    camera.position.y +=
        velocityY * dt;


    /*
       FIND FLOOR / STAIR
    */

    const floor =
        getFloor();


    if(floor !== null){

        const targetY =
            floor +
            PLAYER_HEIGHT;

        const difference =
            camera.position.y -
            targetY;


        /*
           NORMAL FLOOR / STAIRS

           If the surface is within
           ~1.1m beneath us, step onto it.

           This is what lets us walk
           up individual stair steps.
        */

        if(
            difference >= 0 &&
            difference <= 1.1 &&
            velocityY <= 0
        ){

            camera.position.y =
                targetY;

            velocityY = 0;

            grounded = true;

        }


        /*
           LANDING AFTER JUMP
        */

        else if(
            camera.position.y <=
            targetY + 0.15 &&
            velocityY <= 0
        ){

            camera.position.y =
                targetY;

            velocityY = 0;

            grounded = true;

        }

        else{

            grounded = false;

        }

    }


    /*
       Safety reset.
    */

    if(
        camera.position.y < -20
    ){

        if(library){

            const box =
                new THREE.Box3()
                .setFromObject(
                    library
                );

            const center =
                box.getCenter(
                    new THREE.Vector3()
                );

            camera.position.set(
                center.x,
                box.min.y + 3,
                center.z - 30
            );

        }

        velocityY = 0;

    }

}


/* =========================================================
   DUST
========================================================= */

const dustGeometry =
    new THREE.BufferGeometry();

const dustCount = 900;

const dustPositions =
    new Float32Array(
        dustCount * 3
    );


for(
    let i=0;
    i<dustCount;
    i++
){

    dustPositions[i*3] =
        (Math.random()-.5)*100;

    dustPositions[i*3+1] =
        Math.random()*45;

    dustPositions[i*3+2] =
        (Math.random()-.5)*100;

}


dustGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        dustPositions,
        3
    )
);


const dustMaterial =
    new THREE.PointsMaterial({

        color:0xd8c6a8,

        size:.025,

        transparent:true,

        opacity:.16,

        depthWrite:false

    });


scene.add(
    new THREE.Points(
        dustGeometry,
        dustMaterial
    )
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        composer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            clock.getDelta(),
            0.05
        );

    movement(dt);

    composer.render();

}


animate();

</script>

</body>
</html>
