<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIBRARY OF BABEL</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030405;font-family:Arial,sans-serif}
canvas{display:block}
#hud{
position:fixed;top:20px;left:20px;z-index:10;
color:#d8e8ff;font-size:12px;letter-spacing:2px;
text-shadow:0 0 12px #6aa9ff;pointer-events:none
}
#title{font-size:18px;font-weight:bold}
#status{margin-top:8px;opacity:.65}
#start{
position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
z-index:20;background:radial-gradient(circle,#18202b55,#000 75%);
color:white;cursor:pointer;text-align:center
}
.box{padding:30px 45px;border:1px solid #7898b855;background:#05080dcc;box-shadow:0 0 50px #31507055}
.box h1{margin:0 0 12px;font-size:28px;letter-spacing:8px}
.box p{opacity:.65;letter-spacing:3px;font-size:11px}
#cross{
position:fixed;left:50%;top:50%;width:8px;height:8px;
transform:translate(-50%,-50%);z-index:9;pointer-events:none
}
#cross:before,#cross:after{content:"";position:absolute;background:#dcecff88}
#cross:before{width:8px;height:1px;top:3px}
#cross:after{height:8px;width:1px;left:3px}
</style>
</head>

<body>

<div id="hud">
<div id="title">LIBRARY OF BABEL // AETHER</div>
<div id="status">INITIALIZING ARCHIVE...</div>
</div>

<div id="cross"></div>

<div id="start">
<div class="box">
<h1>LIBRARY OF BABEL</h1>
<p>CLICK TO ENTER</p>
<p>WASD · MOUSE · SHIFT TO SPRINT · ESC TO RELEASE</p>
</div>
</div>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {PointerLockControls} from "three/addons/controls/PointerLockControls.js";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x030405);
scene.fog=new THREE.FogExp2(0x080b10,0.012);

const camera=new THREE.PerspectiveCamera(
72,
innerWidth/innerHeight,
0.05,
500
);

camera.position.set(42,-48,8);

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

document.body.appendChild(renderer.domElement);

const composer=new EffectComposer(renderer);

const renderPass=new RenderPass(scene,camera);
composer.addPass(renderPass);

const bloom=new UnrealBloomPass(
new THREE.Vector2(innerWidth,innerHeight),
0.22,
0.65,
0.88
);

composer.addPass(bloom);
composer.addPass(new OutputPass());

/* lighting */

const ambient=new THREE.HemisphereLight(
0x9db7d8,
0x090604,
1.15
);

scene.add(ambient);

const key=new THREE.DirectionalLight(
0xffd8a0,
3.0
);

key.position.set(15,-20,35);
key.castShadow=true;

key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=1;
key.shadow.camera.far=150;

key.shadow.camera.left=-70;
key.shadow.camera.right=70;
key.shadow.camera.top=70;
key.shadow.camera.bottom=-70;

scene.add(key);

const fill=new THREE.PointLight(
0x6f9dff,
120,
90,
2
);

fill.position.set(-20,0,18);
scene.add(fill);

const warm=new THREE.PointLight(
0xffb35c,
150,
110,
2
);

warm.position.set(25,-25,12);
scene.add(warm);

/* GLB */

const loader=new GLTFLoader();

loader.load(
"babel_library_v10.glb",

(gltf)=>{

const root=gltf.scene;

scene.add(root);

root.traverse((o)=>{

if(!o.isMesh)return;

o.castShadow=true;
o.receiveShadow=true;

if(o.material){

const materials=Array.isArray(o.material)
?o.material:[o.material];

materials.forEach(m=>{

m.needsUpdate=true;

if("roughness" in m)
m.roughness=Math.max(.32,Math.min(.9,m.roughness));

if("metalness" in m)
m.metalness=Math.min(.65,m.metalness);

});

}

});

/* fit */

const box=new THREE.Box3().setFromObject(root);
const center=box.getCenter(new THREE.Vector3());
const size=box.getSize(new THREE.Vector3());

root.position.sub(center);

const maxDim=Math.max(size.x,size.y,size.z);

if(maxDim>180){
root.scale.setScalar(180/maxDim);
}

document.getElementById("status").textContent=
"ARCHIVE ONLINE // 615 STRUCTURAL NODES";

},

undefined,

(err)=>{
console.error(err);
document.getElementById("status").textContent=
"ARCHIVE LOAD ERROR";
}
);

/* controls */

const controls=new PointerLockControls(camera,document.body);

document.getElementById("start").addEventListener(
"click",
()=>controls.lock()
);

controls.addEventListener("lock",()=>{
document.getElementById("start").style.display="none";
});

controls.addEventListener("unlock",()=>{
document.getElementById("start").style.display="flex";
});

/* movement */

const keys={};

addEventListener("keydown",e=>{
keys[e.code]=true;
});

addEventListener("keyup",e=>{
keys[e.code]=false;
});

const clock=new THREE.Clock();

function move(dt){

if(!controls.isLocked)return;

let speed=keys.ShiftLeft||keys.ShiftRight?15:7;

if(keys.KeyW)controls.moveForward(speed*dt);
if(keys.KeyS)controls.moveForward(-speed*dt);
if(keys.KeyA)controls.moveRight(-speed*dt);
if(keys.KeyD)controls.moveRight(speed*dt);

/* keep player above floor */

if(camera.position.y<2.2)
camera.position.y=2.2;

}

/* dust */

const dustGeo=new THREE.BufferGeometry();
const dustCount=1800;
const pos=new Float32Array(dustCount*3);

for(let i=0;i<dustCount;i++){

pos[i*3]=(Math.random()-.5)*150;
pos[i*3+1]=Math.random()*70;
pos[i*3+2]=(Math.random()-.5)*150;

}

dustGeo.setAttribute(
"position",
new THREE.BufferAttribute(pos,3)
);

const dustMat=new THREE.PointsMaterial({
color:0xb9c7d8,
size:.035,
transparent:true,
opacity:.25,
depthWrite:false
});

scene.add(new THREE.Points(dustGeo,dustMat));

/* resize */

addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);
composer.setSize(innerWidth,innerHeight);

});

/* loop */

function animate(){

requestAnimationFrame(animate);

const dt=Math.min(clock.getDelta(),.05);

move(dt);

composer.render();

}

animate();

</script>
</body>
</html>
